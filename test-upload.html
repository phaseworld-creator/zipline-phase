<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zipline Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Zipline Upload Test</h1>
    
    <div class="upload-area">
        <input type="file" id="fileInput" multiple>
    </div>
    
    <button id="uploadBtn" onclick="uploadFiles()">Upload Files</button>
    
    <div id="result"></div>

    <script>
        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please select files first');
                return;
            }
            
            const formData = new FormData();
            
            // Add all selected files to FormData
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('file', fileInput.files[i]);
            }
            
            uploadBtn.disabled = true;
            resultDiv.innerHTML = '<p>Uploading...</p>';
            
            try {
                // CORRECT WAY: Don't set Content-Type header manually
                // Let the browser set it automatically with the correct boundary
                const response = await fetch("http://zipline.phaseworld.top/api/upload", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        // DO NOT include Content-Type here!
                        // The browser will automatically set:
                        // Content-Type: multipart/form-data; boundary=----WebKitFormBoundary...
                        
                        // Only include custom headers if needed:
                        // "Authorization": "Bearer YOUR_TOKEN_HERE"
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <h3>Upload Successful!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                // Show uploaded file URLs
                if (data.files && data.files.length > 0) {
                    const urlsList = data.files.map(f => `<li><a href="${f.url}" target="_blank">${f.url}</a></li>`).join('');
                    resultDiv.innerHTML += `<h4>Uploaded Files:</h4><ul>${urlsList}</ul>`;
                }
                
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>Upload Failed!</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <pre>${error.stack || ''}</pre>
                `;
                console.error('Upload error:', error);
            } finally {
                uploadBtn.disabled = false;
            }
        }
        
        // Example of WRONG way (commented out):
        /*
        async function uploadFilesWRONG() {
            const response = await fetch("http://zipline.phaseworld.top/api/upload", {
                method: "POST",
                headers: {
                    // ❌ WRONG - This will break the upload!
                    "Content-Type": "multipart/form-data; boundary=----something",
                },
                body: formData
            });
        }
        */
    </script>
</body>
</html>
