services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-zipline}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-zipline}
      POSTGRES_DB: ${POSTGRESQL_DB:-zipline}
    volumes:
      - './data/postgres:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'zipline']
      interval: 10s
      timeout: 5s
      retries: 5

  zipline:
    image: ghcr.io/phaseworld-creator/zipline-phase:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRESQL_USER:-zipline}:${POSTGRESQL_PASSWORD:-zipline}@postgresql:5432/${POSTGRESQL_DB:-zipline}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - './uploads:/zipline/uploads'
      - './public:/zipline/public'
      - './themes:/zipline/themes'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://0.0.0.0:3000/api/healthcheck']
      interval: 15s
      timeout: 2s
      retries: 2

# No named volumes — all data lives in local bind-mount folders.
# This means `docker compose down -v` cannot wipe your database.
#
# Data layout:
#   ./data/postgres  — PostgreSQL database files (was: pgdata named volume)
#   ./uploads        — uploaded files
#   ./public         — public static assets
#   ./themes         — custom themes
#
# Existing installs upgrading from the named volume:
# The migrate-data service below runs once on `docker compose up` and copies
# the old pgdata named volume into ./data/postgres automatically, then exits.

  migrate-data:
    image: alpine:3
    restart: 'no'
    volumes:
      - 'pgdata:/old-pgdata:ro'
      - './data/postgres:/new-pgdata'
    command: >
      sh -c "
        if [ -n \"$$(ls -A /old-pgdata 2>/dev/null)\" ] && [ -z \"$$(ls -A /new-pgdata 2>/dev/null)\" ]; then
          echo '[migrate-data] Copying old named volume to ./data/postgres...';
          cp -a /old-pgdata/. /new-pgdata/;
          echo '[migrate-data] Done. Your data has been migrated to the bind mount.';
        else
          echo '[migrate-data] Nothing to migrate (already done or no old data).';
        fi
      "

volumes:
  # Keep pgdata declared so migrate-data can mount it. Once migration is done
  # (./data/postgres is populated), this volume is no longer used.
  pgdata:
