services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-zipline}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-zipline}
      POSTGRES_DB: ${POSTGRESQL_DB:-zipline}
    volumes:
      - './data/postgres:/var/lib/postgresql/data'
      - 'pgdata:/old-pgdata:ro'
      - './docker/pg-entrypoint.sh:/pg-entrypoint.sh:ro'
    entrypoint: ['/bin/sh', '/pg-entrypoint.sh']
    command: postgres
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRESQL_USER:-zipline}']
      interval: 10s
      timeout: 5s
      retries: 5

  zipline:
    image: ghcr.io/phaseworld-creator/zipline-phase:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRESQL_USER:-zipline}:${POSTGRESQL_PASSWORD:-zipline}@postgresql:5432/${POSTGRESQL_DB:-zipline}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - './uploads:/zipline/uploads'
      - './public:/zipline/public'
      - './themes:/zipline/themes'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://0.0.0.0:3000/api/healthcheck']
      interval: 15s
      timeout: 2s
      retries: 2

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Option A — Named tunnel (recommended, token stored in .env as CLOUDFLARE_TUNNEL_TOKEN)
    # Get your token from: https://one.dash.cloudflare.com/ → Networks → Tunnels → Create tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      zipline:
        condition: service_healthy
    # Option B — Config-file tunnel (comment out command/environment above and uncomment below)
    # volumes:
    #   - './cloudflared:/etc/cloudflared'
    # command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run

volumes:
  # Kept so existing installs can still mount it for the one-time auto-migration.
  # Safe to remove from here once ./data/postgres is populated.
  pgdata:
